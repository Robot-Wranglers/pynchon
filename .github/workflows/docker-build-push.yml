# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Build and Push to GHCR
on:
  workflow_call: {}
  push:
    branches: [ mainline, ]
  # pull_request:
  #   branches: [ mainline ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: robot-wranglers/pynchon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=date,pattern={{date 'YYYY.MM.DD'}}
          type=ref,event=branch
          type=sha
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Print pull command
      run: |
        echo "🐳 Image pushed successfully!"
        echo "To pull this image, run:"
        echo "docker pull ${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
        echo "all tags: ${{ fromJSON(steps.meta.outputs.json).tags }}"